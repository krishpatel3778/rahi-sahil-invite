<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rahi &amp; Sahil — Ring Ceremony</title>
<meta name="description" content="Ring ceremony invitation — Wednesday, 16 December 2026.">
<meta name="theme-color" content="#120D0C">

<meta property="og:title" content="Rahi &amp; Sahil — Ring Ceremony">
<meta property="og:description" content="Wednesday, 16 December 2026 · Prakruti Party Plot">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500&display=swap">

<style>
  :root {
    --ink:    #F4EBDD;
    --dim:    #B09C89;
    --gold:   #D4A94A;
    --maroon: #6B1F2E;
    --bg:     #120D0C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
  body {
    font-family: "Karla", system-ui, -apple-system, sans-serif;
    color: var(--ink); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative; width: 100%;
    height: 100vh; height: 100dvh;
    margin-inline: auto;
    overflow: hidden; background: var(--bg);
    cursor: pointer;
  }
  /* On anything wider than tall, a 9:16 video would be cropped to nothing.
     Constrain the whole card to a phone-shaped column instead. */
  @media (min-aspect-ratio: 3/4) {
    body { background: #0A0706; }
    .stage {
      max-width: calc(100dvh * 9 / 16);
      box-shadow: 0 0 90px rgba(0,0,0,0.75);
    }
  }

  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
    opacity: 0; transition: opacity 900ms ease;
  }
  .ready video { opacity: 1; }

  /* ---- loading state ---- */
  .veil {
    position: absolute; inset: 0; z-index: 2;
    background:
      radial-gradient(120% 80% at 50% 92%, rgba(212,169,74,0.20), transparent 62%),
      linear-gradient(170deg, #1C1412 0%, #120D0C 55%, #0C0808 100%);
    display: grid; place-items: center;
    padding-bottom: var(--scrim-h, 250px);
    transition: opacity 900ms ease;
  }
  .veil::after {
    content: ""; position: absolute; inset: -40%;
    background: linear-gradient(105deg, transparent 38%, rgba(212,169,74,0.13) 50%, transparent 62%);
    animation: sweep 3.6s ease-in-out infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-28%); } 100% { transform: translateX(28%); } }
  .ready .veil { opacity: 0; pointer-events: none; }

  .veil-type { position: relative; z-index: 1; text-align: center; padding: 0 22px; }
  .veil-type .k {
    font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 14px; opacity: 0.85;
  }
  .veil-type .n {
    font-family: "Marcellus", Georgia, serif;
    font-size: clamp(26px, 7.5vh, 44px); line-height: 1.2; margin: 0;
  }
  @media (max-height: 620px) {
    .veil-type .k { margin-bottom: 8px; font-size: 9px; }
    .scrim { padding-top: 48px; }
    .occ { font-size: 17px; margin-bottom: 8px; }
    .hr { margin-bottom: 8px; }
    .actions { margin-top: 12px; }
  }
  .veil-type .a { display: block; color: var(--gold); font-size: 0.6em; margin: 2px 0; }

  /* ---- sound control ---- */
  .sound {
    position: absolute; z-index: 5;
    top: calc(14px + env(safe-area-inset-top)); right: 14px;
    display: inline-flex; align-items: center; gap: 9px;
    font-family: "Karla", sans-serif; font-size: 12px;
    letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink);
    background: rgba(18,13,12,0.62);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(212,169,74,0.45);
    border-radius: 100px; padding: 9px 15px; cursor: pointer;
    opacity: 0; transform: translateY(-6px);
    transition: opacity 500ms ease, transform 500ms ease, padding 400ms ease;
  }
  .ready .sound { opacity: 1; transform: none; transition-delay: 600ms; }

  /* a slow gold halo while still muted — motion in the corner pulls the eye */
  .sound.muted { animation: halo 2.6s ease-in-out infinite 1.4s; }
  @keyframes halo {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212,169,74,0.34); }
    55%      { box-shadow: 0 0 0 11px rgba(212,169,74,0); }
  }

  .sound .lab {
    max-width: 140px; overflow: hidden; white-space: nowrap;
    transition: max-width 400ms ease, opacity 300ms ease, margin 400ms ease;
  }
  .sound.mini { padding: 9px 11px; }
  .sound.mini .lab { max-width: 0; opacity: 0; margin-left: -9px; }

  /* equaliser bars — reads as "audio" faster than a speaker glyph */
  .eq { display: inline-flex; align-items: flex-end; gap: 2.5px; height: 13px; }
  .eq i {
    display: block; width: 2.5px; border-radius: 2px;
    background: var(--gold); height: 4px;
    transition: background 300ms ease;
  }
  .sound.muted .eq i:nth-child(1) { animation: bar 1.1s ease-in-out infinite; }
  .sound.muted .eq i:nth-child(2) { animation: bar 1.1s ease-in-out infinite 0.18s; }
  .sound.muted .eq i:nth-child(3) { animation: bar 1.1s ease-in-out infinite 0.36s; }
  .sound.on .eq i { background: var(--ink); }
  .sound.on .eq i:nth-child(1) { animation: bar 0.55s ease-in-out infinite; }
  .sound.on .eq i:nth-child(2) { animation: bar 0.55s ease-in-out infinite 0.12s; }
  .sound.on .eq i:nth-child(3) { animation: bar 0.55s ease-in-out infinite 0.24s; }
  @keyframes bar { 0%, 100% { height: 4px; } 50% { height: 13px; } }

  /* ---- details ---- */
  .scrim {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
    padding: 84px 20px calc(22px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,7,6,0.94) 0%, rgba(10,7,6,0.82) 42%, transparent 100%);
    text-align: center;
  }
  .occ { font-family: "Marcellus", Georgia, serif; font-size: 19px; margin: 0 0 12px; letter-spacing: 0.02em; }
  .hr { width: 34px; height: 1px; background: var(--gold); opacity: 0.6; margin: 0 auto 12px; }
  .when { font-size: 15.5px; margin: 0 0 2px; }
  .time { font-size: 14px; color: var(--dim); margin: 0 0 10px; }
  .where { font-family: "Marcellus", Georgia, serif; font-size: 16px; margin: 0 0 1px; }
  .road { font-size: 13px; color: var(--dim); margin: 0; }

  .actions { display: flex; gap: 9px; margin-top: 18px; max-width: 400px; margin-inline: auto; }
  .actions a {
    flex: 1; text-align: center; text-decoration: none;
    font-size: 13px; letter-spacing: 0.02em; padding: 11px 6px;
    border-radius: 3px; color: var(--gold);
    border: 1px solid rgba(212,169,74,0.38);
    background: rgba(27,20,19,0.72);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .actions a:active { background: var(--maroon); border-color: var(--maroon); color: var(--ink); }

  .grain {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    opacity: 0.16; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.5'/></svg>");
  }

  @media (prefers-reduced-motion: reduce) {
    .veil::after, .eq i, .sound.muted { animation: none; }
    video, .veil, .sound, .sound .lab { transition: none; }
    .eq i { height: 9px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- EDIT: drop your file in as invite.mp4 -->
  <video id="v" autoplay muted loop playsinline preload="auto" disablepictureinpicture>
    <source src="invite.mp4" type="video/mp4">
  </video>

  <div class="veil">
    <div class="veil-type">
      <p class="k">Together with their families</p>
      <p class="n">Rahi<span class="a">&amp;</span>Sahil</p>
    </div>
  </div>

  <div class="grain"></div>

  <button class="sound muted" id="sound" type="button" aria-label="Turn sound on">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="lab" id="lab">Tap for sound</span>
  </button>

  <div class="scrim">
    <p class="occ">Ring Ceremony</p>
    <div class="hr"></div>
    <p class="when">Wednesday, 16 December 2026</p>
    <!-- EDIT: real start time -->
    <p class="time">7:00 pm onwards</p>
    <p class="where">Prakruti Party Plot</p>
    <p class="road">Haidyol Road</p>

    <div class="actions">
      <!-- EDIT: change 190000/220000 if the time changes -->
      <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Rahi%20%26%20Sahil%20%E2%80%94%20Ring%20Ceremony&amp;dates=20261216T190000/20261216T220000&amp;ctz=Asia/Kolkata&amp;location=Prakruti%20Party%20Plot%2C%20Haidyol%20Road" target="_blank" rel="noopener">Add to calendar</a>
      <a href="https://www.google.com/maps/search/?api=1&amp;query=Prakruti%20Party%20Plot%20Haidyol%20Road" target="_blank" rel="noopener">Open in Maps</a>
    </div>
  </div>

</div>

<script>
(function () {
  var stage = document.getElementById("stage");
  var v     = document.getElementById("v");
  var btn   = document.getElementById("sound");
  var lab   = document.getElementById("lab");
  var shrinkTimer;

  // Keep the veil sized to the space above the details block, so the two
  // can never collide on a short screen.
  function measure() {
    var h = document.querySelector(".scrim").offsetHeight;
    document.documentElement.style.setProperty("--scrim-h", h + "px");
  }
  measure();
  window.addEventListener("resize", measure);
  window.addEventListener("orientationchange", function () { setTimeout(measure, 250); });

  function reveal() {
    // Only fade the card away once the video genuinely has picture. Fading it
    // for a video that never arrives leaves a blank screen, which is worse
    // than the card.
    if (!v.videoWidth) return;
    if (!stage.classList.contains("ready")) {
      stage.classList.add("ready");
      shrinkTimer = setTimeout(function () { btn.classList.add("mini"); }, 5200);
    }
  }
  if (v.readyState >= 2) reveal();
  v.addEventListener("loadeddata", reveal);
  v.addEventListener("playing", reveal);
  v.addEventListener("error", failSoft);
  v.querySelector("source").addEventListener("error", failSoft);

  // If the video is missing or won't decode, stay on the invitation card and
  // hide the sound control. The page still reads as an invitation.
  function failSoft() {
    stage.classList.add("novideo");
    btn.style.display = "none";
  }
  setTimeout(function () { if (!v.videoWidth) failSoft(); }, 6000);

  // Muted autoplay is the only autoplay browsers allow.
  var p = v.play();
  if (p && typeof p.catch === "function") {
    p.catch(function () { lab.textContent = "Tap to play"; });
  }

  function paint() {
    var on = !v.muted;
    btn.classList.toggle("on", on);
    btn.classList.toggle("muted", !on);
    lab.textContent = on ? "Sound on" : "Tap for sound";
    btn.setAttribute("aria-label", on ? "Turn sound off" : "Turn sound on");
  }

  function unmute() {
    v.muted = false;
    if (v.paused) v.play();
    paint();
    // show the label again briefly so the state change is legible, then tuck away
    btn.classList.remove("mini");
    clearTimeout(shrinkTimer);
    shrinkTimer = setTimeout(function () { btn.classList.add("mini"); }, 2600);
  }

  // The whole video surface is the tap target — a pill alone is too small.
  // First tap turns sound ON rather than toggling: that's what people want.
  stage.addEventListener("click", function (e) {
    if (e.target.closest("a")) return;          // let the buttons work
    if (v.paused) v.play();
    if (v.muted) { unmute(); } else if (e.target.closest("#sound")) {
      v.muted = true; paint();
      btn.classList.remove("mini");
      clearTimeout(shrinkTimer);
      shrinkTimer = setTimeout(function () { btn.classList.add("mini"); }, 2600);
    }
  });

  paint();
})();
</script>

</body>
</html>
