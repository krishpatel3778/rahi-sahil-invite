<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rahi &amp; Sahil — Ring Ceremony</title>
<meta name="description" content="Ring ceremony invitation — Wednesday, 16 December 2026.">

<!-- Link preview for WhatsApp / Instagram DM. Replace the URL once deployed. -->
<meta property="og:title" content="Rahi &amp; Sahil — Ring Ceremony">
<meta property="og:description" content="Wednesday, 16 December 2026 · Prakruti Party Plot">
<meta property="og:type" content="website">
<meta property="og:image" content="poster.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500&display=swap">

<style>
  :root {
    --ink:    #F2E8DA;
    --dim:    #A89380;
    --gold:   #D4A94A;
    --maroon: #6B1F2E;
    --bg:     #120D0C;
    --card:   #1B1413;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: "Karla", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100%;
    padding: max(20px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { width: 100%; max-width: 440px; }

  .top { text-align: center; padding: 14px 0 20px; }
  .kicker {
    font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 12px;
  }
  h1 {
    font-family: "Marcellus", Georgia, serif; font-weight: 400;
    font-size: clamp(30px, 9vw, 42px); line-height: 1.15;
    margin: 0; letter-spacing: 0.01em;
  }
  h1 .amp { color: var(--gold); display: block; font-size: 0.62em; margin: 3px 0; }

  /* video */
  .frame {
    position: relative; width: 100%; aspect-ratio: 9 / 16;
    background: #000; border-radius: 4px; overflow: hidden;
    border: 1px solid rgba(212,169,74,0.22);
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }

  /* details */
  .details { text-align: center; padding: 26px 4px 0; }
  .occasion {
    font-family: "Marcellus", Georgia, serif; font-size: 21px;
    margin: 0 0 16px; letter-spacing: 0.02em;
  }
  .hr { width: 40px; height: 1px; background: var(--gold); opacity: 0.55; margin: 0 auto 16px; }
  .when { font-size: 16.5px; margin: 0 0 3px; }
  .time { font-size: 15px; color: var(--dim); margin: 0 0 14px; }
  .where { font-family: "Marcellus", Georgia, serif; font-size: 17px; margin: 0 0 2px; }
  .road { font-size: 14px; color: var(--dim); margin: 0; }

  .actions { display: flex; gap: 10px; margin-top: 24px; }
  .actions a {
    flex: 1; text-align: center; text-decoration: none;
    font-size: 13.5px; letter-spacing: 0.02em;
    padding: 12px 8px; border-radius: 3px;
    border: 1px solid rgba(212,169,74,0.4); color: var(--gold);
    background: var(--card);
  }
  .actions a:active { background: var(--maroon); border-color: var(--maroon); color: var(--ink); }

  .foot {
    text-align: center; font-size: 13px; color: var(--dim);
    margin-top: 26px; font-family: "Marcellus", Georgia, serif;
  }
  @media (max-width: 360px) { .actions { flex-direction: column; } }
</style>
</head>
<body>

<div class="sheet">

  <div class="top">
    <p class="kicker">Together with their families</p>
    <h1>Rahi<span class="amp">&amp;</span>Sahil</h1>
  </div>

  <!-- EDIT: drop your file in as invite.mp4, and a still frame as poster.jpg -->
  <div class="frame">
    <video controls playsinline preload="metadata" poster="poster.jpg">
      <source src="invite.mp4" type="video/mp4">
      Your browser can't play this video — the details are below.
    </video>
  </div>

  <div class="details">
    <p class="occasion">Ring Ceremony</p>
    <div class="hr"></div>
    <p class="when">Wednesday, 16 December 2026</p>
    <!-- EDIT: real start time -->
    <p class="time">7:00 pm onwards</p>
    <p class="where">Prakruti Party Plot</p>
    <p class="road">Haidyol Road</p>

    <div class="actions">
      <!-- EDIT: change 190000/220000 if the time changes -->
      <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Rahi%20%26%20Sahil%20%E2%80%94%20Ring%20Ceremony&amp;dates=20261216T190000/20261216T220000&amp;ctz=Asia/Kolkata&amp;location=Prakruti%20Party%20Plot%2C%20Haidyol%20Road" target="_blank" rel="noopener">Add to calendar</a>
      <a href="https://www.google.com/maps/search/?api=1&amp;query=Prakruti%20Party%20Plot%20Haidyol%20Road" target="_blank" rel="noopener">Open in Maps</a>
    </div>

    <p class="foot">We would be glad to have you there</p>
  </div>

</div>

</body>
</html>
