<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rahi &amp; Sahil — Ring Ceremony</title>
<meta name="description" content="Ring ceremony invitation — Wednesday, 16 December 2026.">
<meta name="theme-color" content="#0E0A09">

<meta property="og:title" content="Rahi &amp; Sahil — Ring Ceremony">
<meta property="og:description" content="Wednesday, 16 December 2026 · Prakruti Party Plot">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500&display=swap">

<style>
  :root {
    --ink:   #F4EBDD;
    --dim:   #AE9986;
    --gold:  #D4A94A;
    --maroon:#6B1F2E;
    --bg:    #0E0A09;
    --panel: #191211;
    /* long, decelerating ease — the thing that makes motion read as expensive */
    --ease:  cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: "Karla", system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .scene {
    position: relative; width: 100%;
    height: 100vh; height: 100dvh;
    margin-inline: auto; overflow: hidden;
    background: radial-gradient(130% 90% at 50% 8%, #1A1210 0%, var(--bg) 58%);
  }
  @media (min-aspect-ratio: 3/4) {
    body { background: #070505; }
    .scene { max-width: calc(100dvh * 9 / 16); box-shadow: 0 0 100px rgba(0,0,0,0.8); }
  }

  /* ================= video ================= */
  .player {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    transition: transform 1100ms var(--ease), filter 1000ms var(--ease), opacity 1000ms var(--ease);
  }
  video {
    width: 100%; height: 100%; object-fit: cover;
    display: block; background: #000;
  }
  /* when it's over, the video recedes into a texture behind the words */
  [data-state="done"] .player {
    transform: scale(1.07);
    filter: blur(16px) saturate(0.7);
    opacity: 0.2;
  }

  /* ================= idle card ================= */
  .idle {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 34px;
    padding: 0 24px;
    background: radial-gradient(120% 80% at 50% 88%, rgba(212,169,74,0.16), transparent 62%),
                linear-gradient(175deg, #1C1412 0%, #0E0A09 60%, #080605 100%);
    transition: opacity 700ms var(--ease), transform 900ms var(--ease);
  }
  [data-state="playing"] .idle,
  [data-state="done"] .idle {
    opacity: 0; transform: scale(1.04); pointer-events: none;
  }

  .eyebrow {
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--gold); margin: 0; opacity: 0.9;
  }
  .names {
    font-family: "Marcellus", Georgia, serif; font-weight: 400;
    font-size: clamp(34px, 10vw, 50px); line-height: 1.12;
    margin: 14px 0 0; text-align: center; letter-spacing: 0.015em;
  }
  .names .amp { display: block; color: var(--gold); font-size: 0.55em; margin: 3px 0; }

  /* play control — thin gold ring, breathing */
  .play {
    width: 72px; height: 72px; border-radius: 50%;
    border: 1px solid rgba(212,169,74,0.55);
    background: rgba(255,255,255,0.02);
    display: grid; place-items: center; cursor: pointer;
    position: relative; padding: 0;
    transition: transform 500ms var(--ease), background 400ms ease, border-color 400ms ease;
  }
  .play::before {
    content: ""; position: absolute; inset: -1px; border-radius: 50%;
    border: 1px solid rgba(212,169,74,0.5);
    animation: ripple 3s var(--ease) infinite;
  }
  @keyframes ripple {
    0%   { transform: scale(1);    opacity: 0.6; }
    70%  { transform: scale(1.45); opacity: 0; }
    100% { transform: scale(1.45); opacity: 0; }
  }
  .play:hover { transform: scale(1.06); background: rgba(212,169,74,0.09); }
  .play:active { transform: scale(0.97); }
  .play svg { width: 19px; height: 19px; fill: var(--gold); margin-left: 3px; }
  .play-hint {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--dim); margin: 0;
  }

  /* ================= the reveal ================= */
  .reveal {
    position: absolute; inset: 0; z-index: 4;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 26px; text-align: center;
    pointer-events: none;
  }
  [data-state="done"] .reveal { pointer-events: auto; }

  /* every revealed element shares this; direction and delay are per-element */
  .r {
    opacity: 0;
    transform: translateY(var(--y, 30px));
    filter: blur(7px);
    transition:
      opacity   780ms var(--ease) var(--d, 0ms),
      transform 980ms var(--ease) var(--d, 0ms),
      filter    780ms var(--ease) var(--d, 0ms),
      letter-spacing 1200ms var(--ease) var(--d, 0ms);
  }
  [data-state="done"] .r { opacity: 1; transform: none; filter: none; }

  /* names descend from above, and their tracking settles as they land */
  .rv-eyebrow { --y: -26px; --d: 220ms;
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 12px;
  }
  .rv-names { --y: -46px; --d: 120ms;
    font-family: "Marcellus", Georgia, serif;
    font-size: clamp(30px, 8.5vw, 42px); line-height: 1.14;
    margin: 0 0 22px; letter-spacing: 0.16em;
  }
  [data-state="done"] .rv-names { letter-spacing: 0.015em; }
  .rv-names .amp { display: block; color: var(--gold); font-size: 0.56em; margin: 2px 0; }

  /* the hairline draws itself across the meeting point */
  .rv-rule {
    width: 54px; height: 1px; background: var(--gold); opacity: 0.65;
    margin: 0 0 22px; transform: scaleX(0); transform-origin: 50% 50%;
    transition: transform 900ms var(--ease) 430ms, opacity 500ms ease 430ms;
    filter: none;
  }
  [data-state="done"] .rv-rule { transform: scaleX(1); }

  /* everything below rises */
  .rv-occ  { --y: 30px; --d: 540ms;
    font-family: "Marcellus", Georgia, serif; font-size: 19px;
    margin: 0 0 10px; letter-spacing: 0.02em;
  }
  .rv-when { --y: 30px; --d: 620ms; font-size: 16px; margin: 0 0 14px; }
  .rv-sched { --y: 30px; --d: 700ms;
    display: inline-grid; grid-template-columns: auto auto;
    gap: 4px 18px; text-align: left; margin: 0 0 18px;
  }
  .rv-sched dt { font-size: 14.5px; color: var(--dim); margin: 0; }
  .rv-sched dd { margin: 0; font-size: 15.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .rv-where { --y: 30px; --d: 780ms;
    font-family: "Marcellus", Georgia, serif; font-size: 17px; margin: 0 0 2px;
  }
  .rv-road { --y: 30px; --d: 820ms; font-size: 13.5px; color: var(--dim); margin: 0 0 26px; }

  .rv-actions { --y: 30px; --d: 900ms;
    display: flex; gap: 10px; width: 100%; max-width: 340px; margin: 0 0 20px;
  }
  .rv-actions a {
    flex: 1; text-align: center; text-decoration: none;
    font-size: 13.5px; letter-spacing: 0.02em; padding: 12px 8px;
    border-radius: 3px; color: var(--gold);
    border: 1px solid rgba(212,169,74,0.4);
    background: rgba(25,18,17,0.72);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    transition: background 300ms ease, border-color 300ms ease, color 300ms ease;
  }
  .rv-actions a:hover { background: rgba(212,169,74,0.12); border-color: var(--gold); }
  .rv-actions a:active { background: var(--maroon); border-color: var(--maroon); color: var(--ink); }

  .replay { --y: 22px; --d: 1000ms;
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: 0; cursor: pointer; padding: 6px 4px;
    font-family: "Karla", sans-serif; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);
    transition: color 300ms ease,
      opacity 780ms var(--ease) var(--d), transform 980ms var(--ease) var(--d),
      filter 780ms var(--ease) var(--d);
  }
  .replay:hover { color: var(--gold); }
  .replay svg { width: 13px; height: 13px; fill: currentColor; }

  @media (max-height: 640px) {
    .rv-names { font-size: clamp(26px, 7vh, 34px); margin-bottom: 16px; }
    .rv-rule { margin-bottom: 16px; }
    .rv-road { margin-bottom: 18px; }
    .rv-sched { margin-bottom: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .r, .rv-rule, .player, .idle, .replay { transition-duration: 1ms !important; }
    .play::before { animation: none; }
    [data-state="done"] .player { filter: none; }
  }
</style>
</head>
<body>

<div class="scene" id="scene" data-state="idle">

  <!-- EDIT: drop your file in as invite.mp4 -->
  <div class="player">
    <video id="v" playsinline preload="metadata" disablepictureinpicture>
      <source src="invite.mp4" type="video/mp4">
    </video>
  </div>

  <div class="idle" id="idle">
    <div>
      <p class="eyebrow">Together with their families</p>
      <p class="names">Rahi<span class="amp">&amp;</span>Sahil</p>
    </div>
    <button class="play" id="play" type="button" aria-label="Play the invitation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <p class="play-hint">Play invitation</p>
  </div>

  <div class="reveal">
    <p class="r rv-eyebrow">Together with their families</p>
    <p class="r rv-names">Rahi<span class="amp">&amp;</span>Sahil</p>
    <div class="rv-rule"></div>

    <p class="r rv-occ">Ring Ceremony</p>
    <p class="r rv-when">Wednesday, 16 December 2026</p>
    <dl class="r rv-sched">
      <dt>Ceremony</dt><dd>6:00 pm</dd>
      <dt>Dinner</dt><dd>7:30 pm</dd>
    </dl>
    <p class="r rv-where">Prakruti Party Plot</p>
    <p class="r rv-road">Hadiyol Road</p>

    <div class="r rv-actions">
      <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Rahi%20%26%20Sahil%20%E2%80%94%20Ring%20Ceremony&amp;dates=20261216T180000/20261216T220000&amp;ctz=Asia/Kolkata&amp;location=Prakruti%20Party%20Plot%2C%20Hadiyol%20Road&amp;details=Ceremony%206%3A00%20pm%20%C2%B7%20Dinner%207%3A30%20pm" target="_blank" rel="noopener">Add to calendar</a>
      <a href="https://www.google.com/maps/search/?api=1&amp;query=Prakruti%20Party%20Plot%20Hadiyol%20Road" target="_blank" rel="noopener">Open in Maps</a>
    </div>

    <button class="r replay" id="replay" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
      Play again
    </button>
  </div>

</div>

<script>
(function () {
  var scene  = document.getElementById("scene");
  var v      = document.getElementById("v");
  var play   = document.getElementById("play");
  var replay = document.getElementById("replay");
  var wentFs = false;

  function set(s) { scene.dataset.state = s; }

  function fullscreen() {
    try {
      if (v.requestFullscreen) { var r = v.requestFullscreen(); if (r && r.catch) r.catch(function(){}); }
      else if (v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); }
      else if (v.webkitRequestFullscreen) { v.webkitRequestFullscreen(); }
    } catch (e) {}
  }
  function exitFullscreen() {
    try {
      if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen();
      else if (document.webkitExitFullscreen && document.webkitFullscreenElement) document.webkitExitFullscreen();
    } catch (e) {}
  }

  function start() {
    set("playing");
    v.currentTime = 0;
    v.muted = false;            // a real tap started this, so audio is allowed
    var p = v.play();
    if (p && p.catch) p.catch(function () { set("done"); });   // can't play? show the details
    if (!wentFs) { wentFs = true; fullscreen(); }
  }

  play.addEventListener("click", start);

  replay.addEventListener("click", function () {
    set("playing");
    v.currentTime = 0;
    var p = v.play();
    if (p && p.catch) p.catch(function () { set("done"); });
    fullscreen();
  });

  v.addEventListener("ended", function () {
    exitFullscreen();
    // let the browser finish its own exit-fullscreen animation first, so the
    // two transitions don't fight each other
    setTimeout(function () { set("done"); }, 260);
  });

  // If the video is missing or won't decode, go straight to the details —
  // the page is an invitation first and a video second.
  function noVideo() { set("done"); }
  v.addEventListener("error", noVideo);
  var src = v.querySelector("source");
  if (src) src.addEventListener("error", noVideo);
})();
</script>

</body>
</html>
